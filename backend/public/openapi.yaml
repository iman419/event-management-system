components:
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: string, format: email }
        password_hash: { type: string }
        role:
          type: string
          enum: [admin, organizer, customer]
        is_active: { type: integer }
        created_at: { type: string, format: date-time }

    UserInput:
      type: object
      required: [full_name, email, password_hash, role]
      properties:
        full_name: { type: string }
        email: { type: string, format: email }
        password_hash: { type: string }
        role:
          type: string
          enum: [admin, organizer, customer]
        is_active: { type: integer }

    Venue:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        capacity: { type: integer }
        address: { type: string }
        details: { type: string }
        created_at: { type: string, format: date-time }

    VenueInput:
      type: object
      required: [name, city, capacity]
      properties:
        name: { type: string }
        city: { type: string }
        capacity: { type: integer }
        address: { type: string }
        details: { type: string }

    Event:
      type: object
      properties:
        id: { type: integer }
        organizer_id: { type: integer }
        venue_id: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status:
          type: string
          enum: [draft, published, cancelled]
        created_at: { type: string, format: date-time }

    EventInput:
      type: object
      required: [organizer_id, venue_id, title, starts_at, ends_at, status]
      properties:
        organizer_id: { type: integer }
        venue_id: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status:
          type: string
          enum: [draft, published, cancelled]

    TicketType:
      type: object
      properties:
        id: { type: integer }
        event_id: { type: integer }
        name: { type: string }
        price: { type: number, format: float }
        quantity_available: { type: integer }
        created_at: { type: string, format: date-time }

    TicketTypeInput:
      type: object
      required: [event_id, name, price, quantity_available]
      properties:
        event_id: { type: integer }
        name: { type: string }
        price: { type: number, format: float }
        quantity_available: { type: integer }

    Order:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        total: { type: number, format: float }
        created_at: { type: string, format: date-time }

    OrderInput:
      type: object
      required: [user_id, total]
      properties:
        user_id: { type: integer }
        total: { type: number, format: float }

    OrderItem:
      type: object
      properties:
        id: { type: integer }
        order_id: { type: integer }
        ticket_type_id: { type: integer }
        quantity: { type: integer }
        price_each: { type: number, format: float }

    OrderItemInput:
      type: object
      required: [order_id, ticket_type_id, quantity, price_each]
      properties:
        order_id: { type: integer }
        ticket_type_id: { type: integer }
        quantity: { type: integer }
        price_each: { type: number, format: float }
